name: MATLAB Test
on: [push]

jobs:
  hello:
    strategy:
      matrix:
        release: [R2023a, R2026a]
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          cache: true
        
      - name: disp hello
        uses: matlab-actions/run-command@v3.2
        with:
          command: |
            disp('1. 【Hélló◇wórld'】);
            disp('2. «€こんにちはÇ»');
            ! chcp
            feature locale