name: MATLAB Test
on: [push, workflow_dispatch]

jobs:
  hello:
    strategy:
      matrix:
        release: [R2023a, R2026a]
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
          cache: true

      - name: disp via run-command (may garble on R2023a)
        uses: matlab-actions/run-command@v3.2
        with:
          command: |
            disp('1. 【Hélló◇wórld】');
            disp('2. «€こんにちはÇ»');

      - name: disp via -logfile workaround
        shell: cmd
        run: |
          matlab -batch "disp('1. 【Hélló◇wórld】'); disp('2. «€こんにちはÇ»');" -logfile output.log
          echo === Log file content (UTF-8) ===
          type output.log